[package]
name = "riemann-r"
description = "R entry point of Riemann (extendr); calculations stay in the riemann crate"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]
name = "riemann_r"

[dependencies]
extendr-api = "0.9.0"
riemann = { path = "../../../riemann" }

[profile.release]
lto = false

# Built by R CMD INSTALL for the windows-gnu target, separately from the workspace at the root.
[workspace]
