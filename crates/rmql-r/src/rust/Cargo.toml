[package]
name = "rmql-r"
description = "R entry point of rmql (extendr); calculations stay in the rmql crate"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]
name = "rmql_r"

[dependencies]
extendr-api = "0.9.0"
rmql = { path = "../../../rmql" }

[profile.release]
lto = false

# Built by R CMD INSTALL for the windows-gnu target, separately from the workspace at the root.
[workspace]
