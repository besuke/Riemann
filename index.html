<h1>rmql R repository</h1>
<p>On Windows (R 4.4, 4.5, 4.6) this installs the binary; neither Rust nor Rtools is needed:</p>
<pre>install.packages("rmql",
                 repos = c("https://besuke.github.io/RiemannQL", "https://cloud.r-project.org"))</pre>
<p>Source: <a href="https://github.com/besuke/RiemannQL">github.com/besuke/RiemannQL</a></p>
